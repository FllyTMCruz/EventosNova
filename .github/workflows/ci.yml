# .github/workflows/ci.yml
name: Eventos Nova CI - Equipo 16

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-tests:
    name: Linter, Type Check & Pytest (Cobertura >= 80%)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: testing
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar linter estático con Flake8
        run: |
          flake8 src tests

      - name: Verificar formato de código con Black
        run: |
          black --check --line-length 120 src tests

      - name: Ejecutar suite de pruebas Pytest y validar cobertura >= 80%
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  docker-build:
    name: Verificar build de la imagen Docker
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t eventos-nova-api:ci .
